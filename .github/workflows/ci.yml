name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only value. It is allowlisted in .gitleaks.toml so the secret scan does
  # not flag it, and it is worthless outside this workflow.
  AUTH_SECRET: ci-secret-at-least-32-characters-long

jobs:
  # A secret in a commit is worth more to an attacker than any test failure, so
  # the scan runs first and independently rather than as a step inside another
  # job that might be skipped.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  gate:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Without this every run re-downloads the whole dependency tree.
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # Turbo runs in strict env mode, so a variable missing from turbo.json is
      # invisible to the app at runtime. Free and instant, so it runs first.
      - run: node scripts/env-contract.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration (real Postgres, Redis and ffmpeg)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
          POSTGRES_DB: lms
        ports: ['5435:5432']
        options: >-
          --health-cmd "pg_isready -U lms -d lms"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6382:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lms:lms@localhost:5435/lms?schema=public
      DIRECT_DATABASE_URL: postgresql://lms:lms@localhost:5435/lms?schema=public
      REDIS_URL: redis://localhost:6382
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # ubuntu-latest moved to 24.04, which does not ship ffmpeg the way 22.04
      # did. Installing it explicitly is the only way this stays pinned to
      # something the workflow controls rather than to the runner image.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      # This suite is meaningless without a capable ffmpeg: the media proofs
      # would be skipped rather than failed. `shell: bash` is load-bearing, it
      # adds `-o pipefail` — without it `ffmpeg -version | head -1` reports the
      # exit code of `head`, so a missing binary passes the assertion.
      - name: Assert ffmpeg can do AES-128 HLS
        shell: bash
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
          ffmpeg -h muxer=hls 2>&1 | grep -q 'hls_key_info_file' \
            || { echo 'This ffmpeg cannot do AES-128 HLS'; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # Migrates, seeds (which transcodes real video), boots the API and the
      # worker, runs the suite, shuts it down. The same script developers run
      # locally, so CI cannot drift from the local flow.
      - run: ./scripts/integration.sh

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
          POSTGRES_DB: lms
        ports: ['5435:5432']
        options: >-
          --health-cmd "pg_isready -U lms -d lms"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6382:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lms:lms@localhost:5435/lms?schema=public
      DIRECT_DATABASE_URL: postgresql://lms:lms@localhost:5435/lms?schema=public
      REDIS_URL: redis://localhost:6382
      APP_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # The seed transcodes the demo videos for real, so this lane needs the
      # same ffmpeg the integration lane does.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Assert ffmpeg is present
        shell: bash
        run: ffmpeg -version | head -1
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @lms/e2e exec playwright install --with-deps chromium firefox
      - run: ./scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # Covers the command the README tells a reader to run, which no other job does.
  # The integration and E2E jobs source .env themselves and launch the built apps
  # directly, never through turbo, so both stayed green while `pnpm dev` was
  # broken.
  #
  # This job deliberately declares NO env: block. dev-smoke.sh strips every name
  # .env defines from the child environment, so the app has to get its
  # configuration from the repo, the way a fresh clone does.
  dev-smoke:
    name: pnpm dev serves the app
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
          POSTGRES_DB: lms
        ports: ['5435:5432']
        options: >-
          --health-cmd "pg_isready -U lms -d lms"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6382:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # The seed transcodes the demo videos, and /health reports degraded without
      # a working ffmpeg. dev-smoke.sh tolerates a missing binary, but a lane
      # that skipped it would only ever prove the degraded path.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      # Verbatim from README.md, "Running it". If these lines stop producing a
      # working app, the README is wrong and this job says so.
      - name: Set up .env the way the README says
        run: |
          cp .env.example .env
          sed -i "s|^AUTH_SECRET=|AUTH_SECRET=$(openssl rand -base64 32)|" .env
      - name: Migrate and seed
        run: |
          set -a && . ./.env && set +a
          pnpm db:generate && pnpm db:deploy && pnpm db:seed
      - run: ./scripts/dev-smoke.sh

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built but not pushed. The point is to catch a Dockerfile that breaks
      # before anyone relies on it, not to publish anything from CI.
      - name: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
